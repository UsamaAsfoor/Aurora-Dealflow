app = "aurora-dealflow-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.api"

[env]
  PORT = "8080"
  # Live ATTOM — key must be set via: fly secrets set ATTOM_API_KEY=... -a aurora-dealflow-api
  ATTOM_USE_DEMO = "false"
  OPENAI_USE_DEMO = "true"

[deploy]
  release_command = "node packages/db/dist/migrate.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/health"
